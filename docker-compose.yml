version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-server
    ports:
      - "8080:8080" # Puerto para la interfaz web de Jenkins
      - "50000:50000" # Puerto para agentes Jenkins (remotos)
    volumes:
      - jenkins-data:/var/jenkins_home # Persistencia de datos
      - /var/run/docker.sock:/var/run/docker.sock # Permitir que Jenkins acceda al socket Docker
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false" # Deshabilitar el asistente inicial
      JENKINS_USER: "admin" # Usuario administrador
      JENKINS_PASS: "password" # Contraseña administrador

volumes:
  jenkins-data:
    driver: local
